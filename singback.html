<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sing-Back">
<title>Sing-Back Trainer</title>
<style>
/* One narrow column: status, staff, live pitch, controls, settings. */
:root{
  --bg:#f2f3f6; --surface:#ffffff; --fg:#151923; --muted:#5f6779; --line:#d8dbe3; --staff:#9aa1b2;
  --accent:#2f56c8; --accent-fg:#ffffff; --ok:#1d8551; --bad:#c23838;
  --sans: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f121a; --surface:#181c27; --fg:#e7e9ef; --muted:#8f97a9; --line:#2b3142; --staff:#5a6276;
    --accent:#7d9bf4; --accent-fg:#0f121a; --ok:#4cc38a; --bad:#f07272; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f121a; --surface:#181c27; --fg:#e7e9ef; --muted:#8f97a9; --line:#2b3142; --staff:#5a6276;
  --accent:#7d9bf4; --accent-fg:#0f121a; --ok:#4cc38a; --bad:#f07272; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--sans);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent}
main{max-width:460px;margin:0 auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-size:17px;margin:0;font-weight:650}
.stats{font:13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
#status{font-size:22px;font-weight:600;min-height:1.4em;text-align:center}
.staffbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px}
#staff{display:block;width:100%;height:auto;max-height:240px}
.legend{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#live{text-align:center;font:15px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.4em}
.meter{position:relative;height:6px;background:var(--line);border-radius:3px;max-width:240px;margin:6px auto 0;overflow:hidden}
.meter i{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--accent);left:50%;border-radius:2px}
.meter::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted)}
.level{height:3px;background:var(--line);border-radius:2px;max-width:240px;margin:6px auto 0;overflow:hidden}
.level i{display:block;height:100%;width:0;background:var(--muted)}
.buttons{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
button{font:600 16px var(--sans);padding:14px 10px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:disabled{opacity:.45}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row label{font-size:15px}
.val{font:600 15px var(--mono);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
select{font:15px var(--sans);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.pair{display:flex;gap:6px;align-items:center}
.tip{font-size:13px;color:var(--muted);margin:0;text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <h1>Sing-Back Trainer</h1>
    <div class="stats" id="stats">streak 0</div>
  </header>

  <div id="status">Tap Start</div>

  <div class="staffbox">
    <svg id="staff" role="img" aria-label="Staff showing played and sung notes"></svg>
    <div class="legend"><span><b style="background:var(--fg)"></b>played</span><span><b style="background:var(--ok)"></b>sung right</span><span><b style="background:var(--bad)"></b>sung wrong</span></div>
  </div>

  <div>
    <div id="live">—</div>
    <div class="meter" aria-hidden="true"><i id="needle"></i></div>
    <div class="level" aria-hidden="true"><i id="level"></i></div>
  </div>

  <div class="buttons">
    <button id="startBtn" class="primary">Start</button>
    <button id="replayBtn" disabled>Replay</button>
    <button id="newBtn" disabled>New</button>
  </div>

  <section class="settings" aria-label="Settings">
    <div class="row">
      <label for="nNotes">Notes</label>
      <input id="nNotes" type="range" min="2" max="7" step="1">
      <span class="val" id="nVal"></span>
    </div>
    <div class="row">
      <label for="lo">Range</label>
      <div class="pair">
        <select id="lo" aria-label="Lowest note"></select>
        <span>–</span>
        <select id="hi" aria-label="Highest note"></select>
      </div>
    </div>
    <div class="row">
      <label for="bpm">Tempo</label>
      <input id="bpm" type="range" min="40" max="160" step="5">
      <span class="val" id="bpmVal"></span>
    </div>
    <div class="row">
      <label for="sens">Mic sensitivity</label>
      <input id="sens" type="range" min="1" max="5" step="1">
      <span class="val" id="sensVal"></span>
    </div>
    <div class="row">
      <label for="exact">Must match octave</label>
      <input id="exact" type="checkbox">
    </div>
    <div class="row">
      <label for="peek">Show notes before singing</label>
      <input id="peek" type="checkbox">
    </div>
  </section>

  <p class="tip">Hold each note briefly. If room noise gets picked up as notes, lower the sensitivity. No sound? Check the silent switch.</p>
</main>

<script>
const GLYPH={"g": "M434 -2Q464 103 464 170Q464 223 427 257Q390 291 337 291Q287 291 250 262Q213 232 213 190Q213 160 234 134Q254 107 284 107Q313 107 332 128Q350 150 350 178Q350 240 280 240Q298 268 338 268Q353 268 368 264Q384 259 401 248Q418 237 428 214Q439 190 439 157Q439 136 411 6Q389 12 356 12Q259 12 190 -60Q120 -132 120 -232Q120 -267 132 -303Q143 -339 158 -366Q172 -394 200 -428Q229 -463 248 -484Q268 -504 303 -539Q280 -621 280 -689Q280 -779 313 -840Q346 -900 379 -900Q389 -900 402 -887Q414 -874 426 -851Q438 -828 446 -790Q455 -753 455 -710Q455 -551 342 -447L368 -329Q384 -332 397 -332Q458 -332 500 -282Q542 -233 542 -162Q542 -44 434 -2ZM426 -746Q426 -801 394 -801Q358 -801 333 -748Q308 -695 308 -630Q308 -588 321 -557Q359 -580 392 -640Q426 -699 426 -746ZM498 -128Q498 -183 466 -216Q434 -249 383 -249L428 -23Q498 -52 498 -128ZM407 -17 361 -247Q334 -241 312 -214Q289 -187 289 -158Q289 -143 295 -128Q301 -114 310 -104Q318 -94 327 -86Q336 -78 342 -74Q348 -71 348 -71L340 -66Q307 -75 278 -106Q248 -137 248 -184Q248 -231 278 -270Q307 -310 343 -323L325 -430Q168 -299 168 -177Q168 -104 223 -55Q278 -6 348 -6Q365 -6 407 -17Z", "f": "M564 -704Q582 -704 594 -691Q607 -678 607 -661Q607 -644 593 -631Q579 -618 563 -618Q521 -618 521 -663Q521 -681 534 -692Q547 -704 564 -704ZM607 -469Q607 -450 594 -437Q581 -424 564 -424Q521 -424 521 -469Q521 -485 534 -498Q546 -511 564 -511Q582 -511 594 -497Q607 -483 607 -469ZM285 -757Q366 -757 421 -702Q476 -646 476 -569Q476 -531 466 -495Q455 -459 432 -426Q409 -394 386 -367Q363 -340 326 -313Q289 -286 264 -268Q239 -249 196 -226Q154 -203 136 -194Q117 -184 80 -166L75 -182Q76 -183 102 -200Q128 -217 144 -228Q160 -238 192 -263Q223 -288 244 -310Q265 -331 292 -364Q318 -396 334 -427Q350 -458 362 -498Q373 -538 373 -578Q373 -735 262 -735Q225 -735 199 -726Q173 -716 162 -702Q150 -688 145 -678Q140 -667 140 -659Q140 -644 160 -644Q168 -644 179 -648Q190 -651 194 -651Q221 -651 239 -634Q257 -617 257 -592Q257 -563 235 -544Q213 -525 183 -525Q144 -525 119 -548Q94 -571 94 -607Q94 -673 150 -715Q207 -757 285 -757Z", "s": "M365 -24 319 -6V193L275 209V10L138 63V262L94 279V80L50 96V0L94 -17V-262L50 -245V-341L94 -358V-589L138 -606V-376L275 -429V-659L319 -675V-446L365 -464V-366L319 -348V-104L365 -122ZM275 -88V-332L138 -279V-34Z"};
const NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const nm=m=>NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1);
const SENS=[0.02,0.01,0.005,0.0025,0.0012];
const $=id=>document.getElementById(id);

let settings={n:3,lo:48,hi:69,bpm:60,exact:false,sens:4,peek:false};
try{const s=JSON.parse(localStorage.getItem('singback2')||'null'); if(s) settings={...settings,...s};}catch(e){}
const save=()=>{try{localStorage.setItem('singback2',JSON.stringify(settings));}catch(e){}};

// ---------- settings UI ----------
for(const id of ['lo','hi']){
  for(let m=36;m<=88;m++){const o=document.createElement('option');o.value=m;o.textContent=nm(m);$(id).appendChild(o);}
}
function syncUI(){
  $('nNotes').value=settings.n; $('nVal').textContent=settings.n;
  $('bpm').value=settings.bpm; $('bpmVal').textContent=settings.bpm;
  $('sens').value=settings.sens; $('sensVal').textContent=settings.sens;
  $('lo').value=settings.lo; $('hi').value=settings.hi;
  $('exact').checked=settings.exact; $('peek').checked=settings.peek;
}
syncUI();
$('nNotes').oninput=e=>{settings.n=+e.target.value;$('nVal').textContent=settings.n;save();};
$('bpm').oninput=e=>{settings.bpm=+e.target.value;$('bpmVal').textContent=settings.bpm;save();};
$('sens').oninput=e=>{settings.sens=+e.target.value;$('sensVal').textContent=settings.sens;save();};
$('exact').onchange=e=>{settings.exact=e.target.checked;save();};
$('peek').onchange=e=>{settings.peek=e.target.checked;save();drawStaff();};
function rangeChange(which){
  let lo=+$('lo').value, hi=+$('hi').value;
  if(hi-lo<2){ if(which==='lo') hi=Math.min(88,lo+2); else lo=Math.max(36,hi-2); }
  settings.lo=lo; settings.hi=hi; syncUI(); save(); drawStaff();
}
$('lo').onchange=()=>rangeChange('lo'); $('hi').onchange=()=>rangeChange('hi');

// ---------- notation ----------
const LETTER=[0,0,1,1,2,3,3,4,4,5,5,6], SHARP=[0,1,0,1,0,0,1,0,1,0,1,0];
const GAP=10, HALF=GAP/2, CLEF_W=40, COL_W=46;
function clefInfo(){
  const c=(settings.lo+settings.hi)/2;
  if(c<56) return {type:'bass',off:0,bottom:18};      // bottom line G2
  if(c<64) return {type:'treble8',off:12,bottom:30};  // tenor: treble clef, sounds an octave lower
  return {type:'treble',off:0,bottom:30};             // bottom line E4
}
function staffPos(m,ci){const w=m+ci.off; return (Math.floor(w/12)-1)*7+LETTER[((w%12)+12)%12]-ci.bottom;}
const svgNS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(svgNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;}

let revealed=false, ghost=null;
function drawStaff(){
  const svg=$('staff'); svg.innerHTML='';
  const ci=clefInfo(), n=seq.length||settings.n;
  const showT=revealed||settings.peek;
  const ps=[0,8,-4,12];
  if(seq.length&&showT) seq.forEach(m=>ps.push(staffPos(m,ci)));
  sung.forEach(s=>ps.push(staffPos(s.m,ci)));
  if(ghost!=null) ps.push(staffPos(ghost,ci));
  const pMin=Math.min(...ps)-2, pMax=Math.max(...ps)+2;
  const W=CLEF_W+n*COL_W+8, H=(pMax-pMin)*HALF+6;
  const y=p=>(pMax-p)*HALF+3;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  for(let p=0;p<=8;p+=2) el('line',{x1:2,x2:W-4,y1:y(p),y2:y(p),stroke:'var(--staff)','stroke-width':1},svg);
  // clef
  if(ci.type==='bass'){
    const s=GAP/194; el('path',{d:GLYPH.f,fill:'var(--fg)',transform:`translate(${6-75*s},${y(6)+565*s}) scale(${s})`},svg);
  } else {
    const s=GAP/180; el('path',{d:GLYPH.g,fill:'var(--fg)',transform:`translate(${8-120*s},${y(2)+185*s}) scale(${s})`},svg);
    if(ci.type==='treble8'){const t=el('text',{x:8+11,y:y(-5)+3,'font-size':8,'text-anchor':'middle',fill:'var(--fg)','font-family':'Georgia,serif'},svg);t.textContent='8';}
  }
  const head=(m,x,color,op)=>{
    const p=staffPos(m,ci), cy=y(p), g=el('g',{opacity:op},svg);
    for(let l=-2;l>=p;l-=2) el('line',{x1:x-10,x2:x+10,y1:y(l),y2:y(l),stroke:'var(--staff)','stroke-width':1},g);
    for(let l=10;l<=p;l+=2) el('line',{x1:x-10,x2:x+10,y1:y(l),y2:y(l),stroke:'var(--staff)','stroke-width':1},g);
    el('ellipse',{cx:x,cy:cy,rx:6,ry:4.3,fill:color,transform:`rotate(-20 ${x} ${cy})`},g);
    if(SHARP[((m+ci.off)%12+12)%12]){const k=24/954; el('path',{d:GLYPH.s,fill:color,transform:`translate(${x-17},${cy}) scale(${k}) translate(-50,198)`},g);}
  };
  for(let i=0;i<n;i++){
    const cx=CLEF_W+i*COL_W+COL_W/2, s=sung[i];
    const both=showT&&seq[i]!=null&&s;
    if(showT&&seq[i]!=null) head(seq[i],both?cx-9:cx,'var(--fg)',1);
    if(s) head(s.m,both?cx+9:cx,s.ok?'var(--ok)':'var(--bad)',1);
    else if(ghost!=null&&phase==='listening'&&i===sung.length) head(ghost,showT&&seq[i]!=null?cx+9:cx,'var(--accent)',0.45);
    const next=phase==='listening'&&i===sung.length;
    el('rect',{x:cx-8,y:H-3,width:16,height:2,rx:1,fill:next?'var(--accent)':'var(--line)'},svg);
  }
}

// ---------- audio ----------
let ctx=null, master=null, micStream=null, analyser=null, buf=null, yb=null, timer=null, wake=null;
let running=false, phase='idle', playToken=0;
let seq=[], sung=[], streak=0;

function status(t){$('status').textContent=t;}
function stats(){$('stats').textContent='streak '+streak;}

function pianoNote(m,t,dur){
  const f=440*Math.pow(2,(m-69)/12);
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=Math.min(9000,f*9); lp.connect(master);
  const end=t+dur*0.97;
  const amps=[1,0.5,0.32,0.2,0.13,0.08,0.05];
  amps.forEach((a,k)=>{
    const n=k+1, o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=f*n*Math.sqrt(1+0.0003*n*n);
    const tau=0.55/(1+0.6*k);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(a*0.22,t+0.005);
    g.gain.setTargetAtTime(0,t+0.005,tau);
    g.gain.setTargetAtTime(0,end,0.03);
    o.connect(g); g.connect(lp); o.start(t); o.stop(end+0.25);
  });
}
function blip(){
  const t=ctx.currentTime+0.01, o=ctx.createOscillator(), g=ctx.createGain();
  o.type='sine'; o.frequency.value=1480;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.3,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.16);
}

// YIN pitch detection
let lastRms=0;
function detect(){
  analyser.getFloatTimeDomainData(buf);
  const N=buf.length; let rms=0;
  for(let i=0;i<N;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/N); lastRms=rms;
  if(rms<SENS[settings.sens-1]) return null;
  const sr=ctx.sampleRate, W=N>>1;
  const fMin=Math.max(50,440*Math.pow(2,(settings.lo-69)/12)/2.1);
  const tMin=Math.floor(sr/1200), tMax=Math.min(Math.ceil(sr/fMin),N-W-1);
  if(!yb||yb.length<tMax+2) yb=new Float32Array(tMax+2);
  yb[0]=1; let sum=0;
  for(let tau=1;tau<=tMax;tau++){
    let d=0; for(let i=0;i<W;i++){const v=buf[i]-buf[i+tau]; d+=v*v;}
    sum+=d; yb[tau]=sum?d*tau/sum:1;
  }
  let tau=-1;
  for(let t=tMin;t<=tMax;t++){
    if(yb[t]<0.2){ while(t+1<=tMax&&yb[t+1]<yb[t]) t++; tau=t; break; }
  }
  if(tau<1) return null;
  const a=yb[tau-1], b=yb[tau], c=tau+1<=tMax?yb[tau+1]:b, den=a+c-2*b;
  const shift=den?(a-c)/(2*den):0;
  return sr/(tau+shift);
}

// note segmentation
const HOLD=150, TIMEOUT=8000;
let cand=null, candSince=0, lastReg=null, lastActivity=0;
function resetDetector(){cand=null; lastReg=null; lastActivity=performance.now();}

function showLive(m,cents){
  if(m==null){$('live').textContent='—'; $('needle').style.left='50%'; return;}
  $('live').textContent=nm(m)+'  '+(cents>=0?'+':'')+cents+'¢';
  $('needle').style.left=(50+cents)+'%';
}
function setGhost(m){ if(m!==ghost){ ghost=m; if(phase==='listening') drawStaff(); } }

function tick(){
  if(!analyser) return;
  const now=performance.now(), f=detect();
  $('level').style.width=Math.min(100,Math.sqrt(lastRms/0.1)*100)+'%';
  if(f){
    const midi=69+12*Math.log2(f/440), m=Math.round(midi);
    showLive(m,Math.round((midi-m)*100));
    if(phase!=='listening') return;
    setGhost(m);
    if(m!==cand){cand=m; candSince=now;}
    else if(now-candSince>=HOLD && (lastReg===null || (m-lastReg)%12!==0)){
      lastReg=m; register(m);
    }
  } else {
    showLive(null); cand=null; setGhost(null);
  }
  if(phase==='listening' && now-lastActivity>TIMEOUT) fail(true);
}

function register(m){
  lastActivity=performance.now();
  const exp=seq[sung.length];
  const ok=settings.exact ? m===exp : (m-exp)%12===0;
  sung.push({m,ok}); ghost=null; drawStaff();
  if(!ok) return fail(false);
  if(sung.length===seq.length) success();
}

function newSeq(){
  const {n,lo,hi}=settings; seq=[]; let prev=null;
  for(let i=0;i<n;i++){
    let m, guard=0;
    do{ m=lo+Math.floor(Math.random()*(hi-lo+1)); guard++; }
    while(guard<100 && prev!==null && ((m-prev)%12===0 || Math.abs(m-prev)>12));
    seq.push(m); prev=m;
  }
}

function playSeq(){
  const token=++playToken; phase='playing'; sung=[]; revealed=false; ghost=null; drawStaff(); status('Listen…');
  const dur=60/settings.bpm, t0=ctx.currentTime+0.15;
  seq.forEach((m,i)=>pianoNote(m,t0+i*dur,dur));
  setTimeout(()=>{
    if(token!==playToken||!running) return;
    phase='listening'; resetDetector(); drawStaff(); status('Your turn');
  },(0.15+seq.length*dur+0.35)*1000);
}

function success(){
  phase='pause'; revealed=true; ghost=null; drawStaff(); blip(); streak++; stats(); status('Correct');
  const token=playToken;
  setTimeout(()=>{ if(!running||token!==playToken) return; newSeq(); playSeq(); },1800);
}
function fail(silent){
  phase='pause'; revealed=true; ghost=null; drawStaff(); streak=0; stats(); status(silent?'Didn’t hear you. Again':'Not quite. Again');
  const token=playToken;
  setTimeout(()=>{ if(!running||token!==playToken) return; playSeq(); },2200);
}

async function start(){
  if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
    master=ctx.createGain(); master.gain.value=0.9; master.connect(comp); }
  try{ if(navigator.audioSession) navigator.audioSession.type='play-and-record'; }catch(e){}
  ctx.resume();
  status('Starting…');
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    status('Microphone blocked'); $('live').textContent='Allow microphone access for this page, then tap Start.'; return;
  }
  await ctx.resume();
  const src=ctx.createMediaStreamSource(micStream);
  analyser=ctx.createAnalyser(); analyser.fftSize=4096; src.connect(analyser);
  buf=new Float32Array(analyser.fftSize);
  running=true; timer=setInterval(tick,40);
  try{ wake=await navigator.wakeLock?.request('screen'); }catch(e){}
  $('startBtn').textContent='Stop'; $('replayBtn').disabled=false; $('newBtn').disabled=false;
  newSeq(); playSeq();
}
function stop(){
  running=false; playToken++; phase='idle'; clearInterval(timer); ghost=null;
  if(micStream){micStream.getTracks().forEach(t=>t.stop()); micStream=null;}
  analyser=null; try{wake?.release();}catch(e){} wake=null;
  $('startBtn').textContent='Start'; $('replayBtn').disabled=true; $('newBtn').disabled=true;
  status('Tap Start'); showLive(null); $('level').style.width='0'; drawStaff();
}

$('startBtn').onclick=()=>{ running?stop():start(); };
$('replayBtn').onclick=()=>{ if(running) playSeq(); };
$('newBtn').onclick=()=>{ if(running){ newSeq(); playSeq(); } };

// example sequence on the staff until you press Start
seq=[50,57,54]; sung=[{m:50,ok:true},{m:59,ok:false}]; revealed=true; drawStaff();
</script>
